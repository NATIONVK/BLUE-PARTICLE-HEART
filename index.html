<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Blue Particle Heart</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  touch-action:none;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  background:#000;
  touch-action:none;
}

/* SETTINGS BUTTON */
#settingsButton{
  position:fixed;
  top:16px;
  right:16px;
  z-index:10;
  width:38px;
  height:38px;
  border:1px solid rgba(50,145,255,.3);
  border-radius:12px;
  background:rgba(3,15,35,.72);
  color:#64baff;
  font-size:19px;
  display:grid;
  place-items:center;
  cursor:pointer;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

/* SETTINGS PANEL */
#settingsPanel{
  position:fixed;
  top:62px;
  right:16px;
  z-index:11;
  width:min(245px,calc(100vw - 32px));
  padding:16px;
  border:1px solid rgba(50,145,255,.25);
  border-radius:15px;
  background:rgba(3,9,22,.94);
  color:#dceeff;
  box-shadow:0 8px 35px rgba(0,65,180,.15);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  display:none;
}

#settingsPanel.open{
  display:block;
}

.panelHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px;
}

.panelHeader strong{
  font-size:13px;
  letter-spacing:1.5px;
  color:#7bc4ff;
}

#closeSettings{
  border:0;
  background:none;
  color:#8cbce9;
  font-size:21px;
  cursor:pointer;
  padding:2px 5px;
}

.control{
  margin-bottom:18px;
}

.controlTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  font-size:12px;
  color:#c4dcf5;
}

.controlTop output{
  color:#61b5ff;
  font-variant-numeric:tabular-nums;
}

input[type="range"]{
  display:block;
  width:100%;
  height:4px;
  border-radius:10px;
  accent-color:#258fff;
  cursor:pointer;
}

.toggleRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:12px;
  color:#c4dcf5;
}

.toggleRow input{
  accent-color:#258fff;
  width:17px;
  height:17px;
}

.panelNote{
  font-size:10px;
  color:rgba(140,190,235,.55);
  line-height:1.5;
  margin-top:5px;
}

#hint{
  position:fixed;
  bottom:24px;
  left:0;
  width:100%;
  text-align:center;
  color:rgba(75,165,255,.4);
  font-size:11px;
  letter-spacing:3px;
  pointer-events:none;
  transition:opacity 1s;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<button id="settingsButton" aria-label="Settings">⚙</button>

<div id="settingsPanel">
  <div class="panelHeader">
    <strong>HEART SETTINGS</strong>
    <button id="closeSettings" aria-label="Close">×</button>
  </div>

  <div class="control">
    <div class="controlTop">
      <label for="heartSize">Heart Size</label>
      <output id="heartSizeValue">100%</output>
    </div>
    <input id="heartSize" type="range"
      min="70" max="135" value="100" step="1">
  </div>

  <div class="control">
    <div class="controlTop">
      <label for="motion">Particle Movement</label>
      <output id="motionValue">100%</output>
    </div>
    <input id="motion" type="range"
      min="50" max="200" value="100" step="5">
  </div>

  <div class="control">
    <div class="controlTop">
      <label for="heartbeatControl">Heartbeat Intensity</label>
      <output id="heartbeatValue">100%</output>
    </div>
    <input id="heartbeatControl" type="range"
      min="0" max="180" value="100" step="5">
  </div>

  <div class="toggleRow">
    <label for="autoDissolve">Auto Dissolve & Reform</label>
    <input id="autoDissolve" type="checkbox" checked>
  </div>

  <p class="panelNote">
    Adjust the heart and particle animation without interrupting the experience.
  </p>
</div>

<div id="hint">TOUCH • DRAG • RELEASE</div>

<script>
(() => {
"use strict";

/* ELEMENTS */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d",{alpha:false});
const hint=document.getElementById("hint");

const settingsButton=document.getElementById("settingsButton");
const settingsPanel=document.getElementById("settingsPanel");
const closeSettings=document.getElementById("closeSettings");

const heartSizeInput=document.getElementById("heartSize");
const motionInput=document.getElementById("motion");
const heartbeatInput=document.getElementById("heartbeatControl");
const autoDissolveInput=document.getElementById("autoDissolve");

const heartSizeValue=document.getElementById("heartSizeValue");
const motionValue=document.getElementById("motionValue");
const heartbeatValue=document.getElementById("heartbeatValue");

/* UTILITIES */

const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

/* CONFIG */

const CONFIG={
  mobileCount:1250,
  desktopCount:2100,
  ambientCount:100,
  orbitCount:8,
  baseHeartScale:.235,
  dissolveDuration:2.8,
  gatherDuration:2.1
};

let heartSizeMultiplier=1;
let motionMultiplier=1;
let heartbeatMultiplier=1;
let autoDissolve=true;

/* STATE */

let W=0,H=0,DPR=1;
let particles=[];
let ambient=[];
let orbiters=[];

let lastTime=0;
let clock=0;
let frame=0;

let mode="normal";

let pointer={
  x:0,
  y:0,
  down:false,
  active:false
};

let heartCenter={x:0,y:0};

let gatherTime=0;
let dissolveTime=0;
let nextDissolve=24;
let heartbeat=0;

/* SETTINGS UI */

function toggleSettings(){
  settingsPanel.classList.toggle("open");
}

settingsButton.addEventListener("click",e=>{
  e.stopPropagation();
  toggleSettings();
});

closeSettings.addEventListener("click",()=>{
  settingsPanel.classList.remove("open");
});

settingsPanel.addEventListener("pointerdown",e=>{
  e.stopPropagation();
});

settingsPanel.addEventListener("pointermove",e=>{
  e.stopPropagation();
});

settingsPanel.addEventListener("pointerup",e=>{
  e.stopPropagation();
});

heartSizeInput.addEventListener("input",()=>{
  heartSizeMultiplier=Number(heartSizeInput.value)/100;
  heartSizeValue.textContent=heartSizeInput.value+"%";
});

motionInput.addEventListener("input",()=>{
  motionMultiplier=Number(motionInput.value)/100;
  motionValue.textContent=motionInput.value+"%";
});

heartbeatInput.addEventListener("input",()=>{
  heartbeatMultiplier=Number(heartbeatInput.value)/100;
  heartbeatValue.textContent=heartbeatInput.value+"%";
});

autoDissolveInput.addEventListener("change",()=>{
  autoDissolve=autoDissolveInput.checked;
});

/* HEART GEOMETRY */

function heartPoint(t){
  const x=16*Math.pow(Math.sin(t),3);

  const y=-(13*Math.cos(t)
    -5*Math.cos(2*t)
    -2*Math.cos(3*t)
    -Math.cos(4*t));

  return{x,y};
}

function createHeartTarget(){
  const t=Math.random()*TAU;
  const p=heartPoint(t);
  const r=Math.sqrt(Math.random());

  return{
    x:p.x*r*.94,
    y:p.y*r*.94
  };
}

function heartScale(){
  return Math.min(W,H)*
    CONFIG.baseHeartScale*
    heartSizeMultiplier/16;
}

function getHeartPosition(x,y,z=0){
  const scale=heartScale();

  const pulse=1+
    heartbeat*.045*heartbeatMultiplier;

  const perspective=1+z*.08;

  return{
    x:heartCenter.x+x*scale*pulse*perspective,
    y:heartCenter.y+y*scale*pulse*perspective
  };
}

/* PARTICLE CLASS */

class Particle{
  constructor(i){
    this.id=i;
    this.target=createHeartTarget();

    this.x=rand(-W,W*2);
    this.y=rand(-H,H*2);

    this.vx=0;
    this.vy=0;

    this.z=rand(-.6,.6);

    // Uniform brightness
    this.size=rand(.85,1.15);
    this.phase=rand(0,TAU);
    this.alpha=rand(.76,.82);
    this.hue=205;

    this.spiral=rand(-1,1);

    this.startX=this.x;
    this.startY=this.y;

    this.orbitAngle=rand(0,TAU);
    this.orbitRadius=rand(.5,1.5);
  }

  setStart(){
    this.startX=this.x;
    this.startY=this.y;
  }

  /* MORE NATURAL NORMAL MOVEMENT */

  updateNormal(dt){
    const pos=getHeartPosition(
      this.target.x,
      this.target.y,
      this.z
    );

    const speed=motionMultiplier;

    // Independent particle movement
    const wave1=Math.sin(
      clock*2.1+this.phase
    );

    const wave2=Math.cos(
      clock*1.55+this.phase*1.7
    );

    const wave3=Math.sin(
      clock*.85+this.phase*2.4
    );

    // Small circular orbital movement
    this.orbitAngle+=dt*(
      .45+this.orbitRadius*.3
    )*speed;

    const orbitX=
      Math.cos(this.orbitAngle)*
      this.orbitRadius*1.15;

    const orbitY=
      Math.sin(this.orbitAngle)*
      this.orbitRadius*1.15;

    // Controlled movement keeps the heart silhouette intact
    const wobbleX=
      (wave1*2.3+wave3*1.0+orbitX)*speed;

    const wobbleY=
      (wave2*2.3+wave3*.8+orbitY)*speed;

    const tx=pos.x+wobbleX;
    const ty=pos.y+wobbleY;

    // Smooth magnetic return to target
    const follow=clamp(dt*6.5,0,1);

    this.x=lerp(this.x,tx,follow);
    this.y=lerp(this.y,ty,follow);

    // Depth animation
    this.z+=Math.sin(
      clock*.7+this.phase
    )*dt*.045*speed;

    this.z=clamp(this.z,-.6,.6);
  }

  updateExplode(dt){
    this.vx*=Math.pow(.985,dt*60);
    this.vy*=Math.pow(.985,dt*60);

    this.x+=this.vx*dt;
    this.y+=this.vy*dt;

    if(pointer.down){
      const dx=pointer.x-this.x;
      const dy=pointer.y-this.y;

      const d2=dx*dx+dy*dy+120;
      const force=clamp(16000/d2,0,18);

      this.vx+=dx*force*dt;
      this.vy+=dy*force*dt;
    }
  }

  updateGather(dt,progress){
    const pos=getHeartPosition(
      this.target.x,
      this.target.y,
      this.z
    );

    const angle=this.spiral*(1-progress)*5.2;
    const radius=(1-progress)*Math.min(W,H)*.10;

    const spiralX=Math.cos(angle)*radius;
    const spiralY=Math.sin(angle)*radius;

    const ease=progress*progress*(3-2*progress);

    const tx=lerp(this.startX,pos.x,ease)+spiralX;
    const ty=lerp(this.startY,pos.y,ease)+spiralY;

    this.x=lerp(this.x,tx,clamp(dt*10,0,1));
    this.y=lerp(this.y,ty,clamp(dt*10,0,1));

    this.vx*=.9;
    this.vy*=.9;
  }

  /* UNIFORM PARTICLE RENDERING */

  draw(){
    const depth=1+this.z*.08;

    const twinkle=
      .97+.03*Math.sin(clock*1.5+this.phase);

    const size=this.size*depth;
    const alpha=this.alpha*twinkle;

    ctx.globalAlpha=alpha;
    ctx.fillStyle="#258fff";

    ctx.beginPath();
    ctx.arc(this.x,this.y,size,0,TAU);
    ctx.fill();

    // Very soft glow
    ctx.globalAlpha=alpha*.08;
    ctx.fillStyle="#258fff";

    ctx.beginPath();
    ctx.arc(this.x,this.y,size*2,0,TAU);
    ctx.fill();
  }
}

/* AMBIENT PARTICLES */

class AmbientParticle{
  constructor(){
    this.reset(true);
  }

  reset(initial=false){
    this.x=rand(0,W);
    this.y=initial?rand(0,H):rand(-30,H+30);

    this.vx=rand(-12,12);
    this.vy=rand(-22,-5);

    this.size=rand(.4,1.2);
    this.alpha=rand(.15,.35);
    this.phase=rand(0,TAU);
  }

  update(dt){
    this.x+=this.vx*dt+
      Math.sin(clock+this.phase)*dt*5;

    this.y+=this.vy*dt;

    const dx=heartCenter.x-this.x;
    const dy=heartCenter.y-this.y;
    const d=Math.sqrt(dx*dx+dy*dy)+1;

    if(d<Math.min(W,H)*.43){
      const strength=
        (1-d/(Math.min(W,H)*.43))*18;

      this.vx+=dx/d*strength*dt;
      this.vy+=dy/d*strength*dt;
    }

    if(this.y<-35||this.x<-35||this.x>W+35){
      this.reset();
    }
  }

  draw(){
    ctx.globalAlpha=this.alpha*
      (.7+.3*Math.sin(clock*2+this.phase));

    ctx.fillStyle="#258fff";

    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,TAU);
    ctx.fill();
  }
}

/* ORBITERS */

function createOrbiters(){
  orbiters=[];

  for(let i=0;i<CONFIG.orbitCount;i++){
    orbiters.push({
      angle:rand(0,TAU),
      radius:rand(.62,.83),
      speed:rand(.12,.32)*
        (Math.random()<.5?-1:1),
      size:rand(1,1.6),
      phase:rand(0,TAU)
    });
  }
}

function updateOrbiters(dt){
  for(const o of orbiters){
    o.angle+=o.speed*dt*motionMultiplier;
  }
}

function drawOrbiters(){
  const scale=heartScale();

  ctx.save();
  ctx.globalCompositeOperation="source-over";

  for(const o of orbiters){
    const radius=scale*18*o.radius;

    const x=heartCenter.x+
      Math.cos(o.angle)*radius;

    const y=heartCenter.y+
      Math.sin(o.angle)*radius*.75;

    ctx.globalAlpha=.45+
      .12*Math.sin(clock*2+o.phase);

    ctx.fillStyle="#258fff";

    ctx.beginPath();
    ctx.arc(x,y,o.size,0,TAU);
    ctx.fill();
  }

  ctx.restore();
}

/* SPIRAL STREAM */

function drawSpiralStreams(){
  ctx.save();
  ctx.globalCompositeOperation="source-over";

  for(let j=0;j<3;j++){
    const direction=j%2===0?1:-1;

    ctx.beginPath();

    for(let i=0;i<70;i++){
      const t=i/69;

      const angle=
        clock*.65*direction+
        t*TAU*1.7+j*2.1;

      const radius=heartScale()*(21-t*13);

      const x=heartCenter.x+
        Math.cos(angle)*radius;

      const y=heartCenter.y+
        Math.sin(angle)*radius*.7;

      if(i===0)ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }

    ctx.strokeStyle="rgba(20,105,255,.075)";
    ctx.lineWidth=1;
    ctx.stroke();
  }

  ctx.restore();
}

/* ENERGY WAVE */

function drawEnergy(){
  const scale=heartScale();

  ctx.save();
  ctx.globalCompositeOperation="source-over";

  for(let i=0;i<2;i++){
    const radius=scale*(15+i*2)+
      Math.sin(clock*1.5+i)*3;

    ctx.beginPath();

    ctx.ellipse(
      heartCenter.x,
      heartCenter.y,
      radius,
      radius*.85,
      0,0,TAU
    );

    ctx.strokeStyle=
      `rgba(20,105,255,${.035-i*.01})`;

    ctx.lineWidth=1;
    ctx.stroke();
  }

  ctx.restore();
}

/* HEARTBEAT */

function updateHeartbeat(){
  const beat=(clock*1.15)%TAU;

  heartbeat=Math.pow(
    Math.max(0,Math.sin(beat)),12
  );
}

/* RESIZE */

function resize(){
  const oldW=W,oldH=H;

  W=window.innerWidth;
  H=window.innerHeight;

  DPR=Math.min(window.devicePixelRatio||1,1.6);

  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);

  ctx.setTransform(DPR,0,0,DPR,0,0);

  if(!particles.length){
    heartCenter.x=W/2;
    heartCenter.y=H/2;

    const count=W<700?
      CONFIG.mobileCount:CONFIG.desktopCount;

    for(let i=0;i<count;i++){
      particles.push(new Particle(i));
    }

    for(let i=0;i<CONFIG.ambientCount;i++){
      ambient.push(new AmbientParticle());
    }

    createOrbiters();
  }else{
    const sx=oldW?W/oldW:1;
    const sy=oldH?H/oldH:1;

    for(const p of particles){
      p.x*=sx;
      p.y*=sy;
      p.startX*=sx;
      p.startY*=sy;
    }

    for(const a of ambient){
      a.x*=sx;
      a.y*=sy;
    }

    heartCenter.x=W/2;
    heartCenter.y=H/2;
  }
}

window.addEventListener("resize",resize,{passive:true});

/* EXPLOSION */

function explodeHeart(){
  if(mode==="explode")return;

  mode="explode";

  for(const p of particles){
    const dx=p.x-heartCenter.x;
    const dy=p.y-heartCenter.y;

    const distance=Math.sqrt(dx*dx+dy*dy)+1;
    const power=rand(100,390);

    p.vx=dx/distance*power+rand(-90,90);
    p.vy=dy/distance*power+rand(-90,90);

    p.setStart();
  }
}

/* REFORMATION */

function reformHeart(x,y){
  heartCenter.x=clamp(x,40,W-40);
  heartCenter.y=clamp(y,40,H-40);

  gatherTime=0;

  for(const p of particles){
    p.setStart();
    p.spiral=rand(-1,1);
  }

  mode="gather";
}

/* AUTO DISSOLVE */

function startDissolve(){
  if(mode!=="normal")return;

  mode="dissolve";
  dissolveTime=0;

  for(const p of particles){
    const dx=p.x-heartCenter.x;
    const dy=p.y-heartCenter.y;

    const d=Math.sqrt(dx*dx+dy*dy)+1;

    p.vx=dx/d*rand(20,100)+rand(-20,20);
    p.vy=dy/d*rand(20,100)+rand(-20,20);

    p.setStart();
  }
}

/* POINTER INTERACTION */

function pointerDownHandler(e){
  if(settingsPanel.contains(e.target)||
     settingsButton.contains(e.target))return;

  e.preventDefault();

  pointer.x=e.clientX;
  pointer.y=e.clientY;
  pointer.down=true;
  pointer.active=true;

  hint.style.opacity="0";

  if(mode==="gather"||mode==="dissolve"){
    mode="explode";
    for(const p of particles)p.setStart();
  }

  if(mode==="normal"){
    for(const p of particles){
      p.updateNormal(1/60);
    }
  }

  explodeHeart();
}

function pointerMoveHandler(e){
  if(!pointer.down)return;

  e.preventDefault();

  pointer.x=e.clientX;
  pointer.y=e.clientY;
}

function pointerUpHandler(e){
  if(!pointer.down)return;

  if(e&&Number.isFinite(e.clientX)){
    pointer.x=e.clientX;
    pointer.y=e.clientY;
  }

  pointer.down=false;

  reformHeart(
    pointer.x||W/2,
    pointer.y||H/2
  );
}

canvas.addEventListener("pointerdown",pointerDownHandler);
canvas.addEventListener("pointermove",pointerMoveHandler);
window.addEventListener("pointerup",pointerUpHandler);
window.addEventListener("pointercancel",pointerUpHandler);

/* BACKGROUND */

function drawBackground(){
  ctx.fillStyle="rgba(0,0,0,.28)";
  ctx.fillRect(0,0,W,H);
}

function drawGlassGlow(){
  const scale=heartScale();

  ctx.save();
  ctx.globalCompositeOperation="source-over";

  const glow=ctx.createRadialGradient(
    heartCenter.x,heartCenter.y,scale*2,
    heartCenter.x,heartCenter.y,scale*22
  );

  glow.addColorStop(0,"rgba(0,45,130,.065)");
  glow.addColorStop(.45,"rgba(0,25,100,.025)");
  glow.addColorStop(1,"rgba(0,0,0,0)");

  ctx.fillStyle=glow;
  ctx.fillRect(0,0,W,H);

  ctx.restore();
}

/* RENDER PARTICLES */

function drawParticles(){
  ctx.save();
  ctx.globalCompositeOperation="source-over";

  for(const p of particles){
    p.draw();
  }

  ctx.restore();
}

function drawAmbient(){
  ctx.save();
  ctx.globalCompositeOperation="source-over";

  for(const a of ambient){
    a.draw();
  }

  ctx.restore();
}

/* MAIN ANIMATION LOOP */

function animate(timestamp){
  if(!lastTime)lastTime=timestamp;

  const dt=Math.min(
    (timestamp-lastTime)/1000,.033
  );

  lastTime=timestamp;
  clock+=dt;
  frame++;

  updateHeartbeat();

  drawBackground();

  // Gentle parallax
  if(!pointer.down&&mode==="normal"){
    const px=Math.sin(clock*.3)*W*.002;
    const py=Math.cos(clock*.25)*H*.002;

    heartCenter.x=lerp(
      heartCenter.x,W/2+px,dt*.8
    );

    heartCenter.y=lerp(
      heartCenter.y,H/2+py,dt*.8
    );
  }

  drawGlassGlow();

  for(const a of ambient){
    a.update(dt);
  }

  drawAmbient();

  if(mode==="normal"){
    for(const p of particles){
      p.updateNormal(dt);
    }

    updateOrbiters(dt);

    drawSpiralStreams();
    drawEnergy();
    drawOrbiters();

    if(autoDissolve&&clock>nextDissolve){
      startDissolve();
      nextDissolve=clock+rand(24,34);
    }
  }

  else if(mode==="explode"){
    for(const p of particles){
      p.updateExplode(dt);
    }

    drawSpiralStreams();

    if(!pointer.down){
      reformHeart(
        pointer.x||W/2,
        pointer.y||H/2
      );
    }
  }

  else if(mode==="gather"){
    gatherTime+=dt;

    const progress=clamp(
      gatherTime/CONFIG.gatherDuration,
      0,1
    );

    for(const p of particles){
      p.updateGather(dt,progress);
    }

    drawSpiralStreams();

    if(progress>=1){
      mode="normal";

      for(const p of particles){
        const pos=getHeartPosition(
          p.target.x,p.target.y,p.z
        );

        p.x=pos.x;
        p.y=pos.y;
        p.vx=0;
        p.vy=0;
      }
    }
  }

  else if(mode==="dissolve"){
    dissolveTime+=dt;

    const progress=clamp(
      dissolveTime/CONFIG.dissolveDuration,
      0,1
    );

    for(const p of particles){
      p.vx*=Math.pow(.965,dt*60);
      p.vy*=Math.pow(.965,dt*60);

      p.x+=p.vx*dt;
      p.y+=p.vy*dt;

      if(progress>.45){
        const pos=getHeartPosition(
          p.target.x,p.target.y,p.z
        );

        p.x=lerp(
          p.x,pos.x,clamp(dt*1.5,0,1)
        );

        p.y=lerp(
          p.y,pos.y,clamp(dt*1.5,0,1)
        );
      }
    }

    drawSpiralStreams();

    if(progress>=1){
      for(const p of particles){
        const pos=getHeartPosition(
          p.target.x,p.target.y,p.z
        );

        p.x=pos.x;
        p.y=pos.y;
        p.vx=0;
        p.vy=0;
      }

      mode="normal";
    }
  }

  drawParticles();

  ctx.globalAlpha=1;

  requestAnimationFrame(animate);
}

/* START */

resize();
requestAnimationFrame(animate);

})();
</script>
</body>
</html>
